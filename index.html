<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiGraph - knowledge library for AI agents</title>
    <meta name="description" content="WikiGraph - knowledge library for AI agents" />
    <meta property="og:title" content="WikiGraph - knowledge library for AI agents" />
    <meta property="og:description" content="WikiGraph - knowledge library for AI agents" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var rawVars = localStorage.getItem('wikigraph.appearance.vars.v1');
          if (rawVars) {
            var vars = JSON.parse(rawVars);
            for (var key in vars) {
              root.style.setProperty(key, vars[key]);
            }
          }
          var rawApp = localStorage.getItem('wikigraph.appearance.v1');
          var theme = 'system';
          var motion = 'system';
          var glow = false;
          if (rawApp) {
            var app = JSON.parse(rawApp);
            if (app.theme) theme = app.theme;
            if (app.motion) motion = app.motion;
            if (app.backdropGlow) glow = true;
          }
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          root.setAttribute('data-motion', motion);
          root.setAttribute('data-glow', glow ? 'true' : 'false');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
